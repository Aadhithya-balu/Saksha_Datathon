server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Backend is still booting (cold start on serverless hosts): return a
    # retryable 503 so the frontend auto-retries instead of showing a 502/500.
    error_page 502 503 504 =503 @backend_starting;

    location @backend_starting {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"DB_POOL_EXHAUSTED","message":"Saksha backend is still starting. Please wait a moment and retry.","status":503}}';
    }

    # ============================
    # FastAPI
    # ============================

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # ============================
    # React
    # ============================

    location / {
        try_files $uri /index.html;
    }
}