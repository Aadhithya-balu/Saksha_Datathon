name: Saksha MLOps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly retrain so registry artifacts stay close to live data
    # (issue #145: models must keep up as crime cases are created).
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  mlops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run MLOps cycle
        working-directory: backend
        run: python -m app.mlops
      - name: Smoke compile
        working-directory: backend
        run: python -m py_compile $(git ls-files 'app/**/*.py')
