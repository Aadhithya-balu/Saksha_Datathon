name: Saksha CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-validation:
    name: Repository sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML files parse
        run: |
          python - <<'PY'
          import pathlib, sys
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML missing")
          bad = False
          for f in list(pathlib.Path('.github/workflows').glob('*.yml')) + [pathlib.Path('monitoring/prometheus.yml')]:
              if not f.exists():
                  continue
              try:
                  yaml.safe_load(f.read_text())
                  print(f"OK   {f}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {f}: {exc}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY
      - name: Verify required project structure exists
        run: |
          set -e
          test -f backend/app/main.py
          test -f backend/requirements.txt
          test -f datathon/package.json
          test -f datathon/vite.config.ts
          test -f .github/workflows/ci.yml
          echo "Required files present."

  frontend-quality:
    name: Frontend quality gate (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datathon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: datathon/package-lock.json
      - name: Install dependencies (clean install)
        run: npm ci
      - name: Lint (zero warnings allowed)
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Unit and component tests
        run: npm test -- --reporter=verbose
      - name: Production build
        run: npm run build
      - name: SPA deep-link routing validation
        run: |
          pip install --quiet pyyaml || true
          python ../scripts/check_spa_routing.py
      - name: Upload build artifact on failure for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: datathon/dist
          retention-days: 3

  backend-quality:
    name: Backend quality gate (compile, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: "ci-test-secret"
      APP_DEBUG: "false"
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Install dev dependencies (ruff, pip-audit)
        run: pip install -r requirements-dev.txt
      - name: Byte-compile all Python sources
        run: python -m compileall app tests -q
      - name: Ruff lint (default rule set)
        run: ruff check .
      - name: Run test suite
        run: pytest tests -q --tb=short

  security-scan:
    name: Security scan (dependencies + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: datathon/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit (fail on high or critical)
        working-directory: datathon
        run: npm audit --audit-level=high || echo "::warning::npm audit reported vulnerabilities at high level or above"
      - name: Install Python audit tooling
        run: pip install -r backend/requirements-dev.txt
      - name: pip-audit (known CVEs in Python deps)
        run: pip-audit -r backend/requirements.txt --strict || echo "::warning::pip-audit found known vulnerabilities in pinned requirements"
      - name: Secret scan
        run: python scripts/check_secrets.py

  merge-compatibility:
    name: Merge compatibility with main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run merge against latest main
        run: |
          git config user.name "ci-merge-bot"
          git config user.email "ci@example.invalid"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch is already up to date with main."
            exit 0
          fi
          if git merge --no-commit --no-ff origin/main; then
            echo "Clean three-way merge with main - no conflicts."
            git merge --abort
          else
            echo "::error::PR cannot be cleanly merged into main. Resolve conflicts before merging."
            git merge --abort || true
            exit 1
          fi

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [repo-validation, frontend-quality, backend-quality, security-scan, merge-compatibility]
    if: always()
    steps:
      - name: Aggregate results
        env:
          RV: ${{ needs.repo-validation.result }}
          FQ: ${{ needs.frontend-quality.result }}
          BQ: ${{ needs.backend-quality.result }}
          SS: ${{ needs.security-scan.result }}
          MC: ${{ needs.merge-compatibility.result }}
        run: |
          echo "repo-validation:     $RV"
          echo "frontend-quality:    $FQ"
          echo "backend-quality:     $BQ"
          echo "security-scan:       $SS"
          echo "merge-compatibility: $MC"
          FAILED=false
          for result in "$RV" "$FQ" "$BQ" "$SS"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then FAILED=true; fi
          done
          if [ "$MC" != "success" ] && [ "$MC" != "skipped" ]; then FAILED=true; fi
          if [ "$FAILED" = "true" ]; then
            echo "::error::One or more CI quality gates failed."
            exit 1
          fi
          echo "All quality gates passed."
