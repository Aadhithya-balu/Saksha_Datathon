name: Saksha CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///:memory:
          APP_DEBUG: "false"
          DEBUG: "false"
          JWT_SECRET_KEY: ci-test-secret
        run: python -m pytest
      - name: Compile backend package
        working-directory: backend
        run: python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: datathon/package-lock.json
      - name: Install frontend dependencies
        working-directory: datathon
        run: npm ci
      - name: Build frontend
        working-directory: datathon
        run: npm run build

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend compose file
        run: docker compose -f backend/docker-compose.yml config
