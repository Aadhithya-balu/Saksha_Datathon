# Alembic configuration for Saksha
# Usage:
#   alembic upgrade head       -- apply all pending migrations
#   alembic revision --autogenerate -m "description"  -- generate migration
#   alembic history            -- list migration chain

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Database URL is overridden in env.py from app.core.config
# This is a fallback only; env.py always wins.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
