version: "3.9"

services:
  backend:
    build: .
    container_name: saksha_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: saksha_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saksha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saksha_user}
      POSTGRES_DB: ${POSTGRES_DB:-saksha_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saksha_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped


volumes:
  postgres_data:
